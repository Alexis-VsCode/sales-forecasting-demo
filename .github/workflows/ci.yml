# Integración continua: lint, formato, pruebas, pipeline reproducible y ejecución del notebook.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg          # matplotlib sin pantalla
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Lint, pruebas y pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Instalar paquete y dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (formato)
        run: ruff format --check src tests

      - name: Pytest
        run: pytest -q

      - name: Ejecutar pipeline de pronóstico
        run: python -m sales_forecasting --config configs/forecast.toml --output-dir ci-reports

      - name: Subir resultados del pipeline
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: ci-reports
          if-no-files-found: error
          retention-days: 14

  notebook:
    name: Ejecutar notebook (sin commitear)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Instalar paquete y dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m ipykernel install --user --name python3

      - name: Ejecutar notebooks con nbconvert
        # nbconvert ejecuta cada notebook con su propia carpeta como directorio de trabajo,
        # por eso las rutas relativas del notebook (../src/data/) funcionan.
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=600 \
            --output-dir ci-notebooks notebooks/*.ipynb
          jupyter nbconvert --to html ci-notebooks/*.ipynb

      - name: Subir notebooks ejecutados
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-ejecutados
          path: ci-notebooks
          if-no-files-found: error
          retention-days: 14
